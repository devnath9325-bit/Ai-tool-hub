<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tool Hub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🤖 AI Tool Hub</h1>
  <p>All your AI tools in one place</p>
</header>

<main>
  <div class="tools">

    <button onclick="openTool('chat')">🤖 AI Chat</button>
    <button onclick="openTool('script')">✍️ Script Writer</button>
    <button onclick="openTool('translate')">🌐 Translator</button>
    <button onclick="openTool('content')">📝 Content Writer</button>
    <button onclick="openTool('summary')">📄 Summarizer</button>
    <button onclick="openTool('image')">🖼️ AI Image</button>
    <button onclick="openTool('voice')">🎙️ AI Voice</button>

  </div>

  <section id="toolBox">
    <h2>Choose an AI Tool</h2>
    <p>Select a tool above to get started.</p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
